name: Build Windows Portable Executable (Tauri)

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'web/package.json'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: 'web/src-tauri -> target'

      - name: Extract App Version
        id: get_version
        shell: pwsh
        run: |
          $versionJson = Get-Content -Raw VERSION.json | ConvertFrom-Json
          $appVersion = $versionJson.appVersion
          Write-Host "App version: $appVersion"
          "APP_VERSION=$appVersion" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install dependencies & build frontend bundles
        working-directory: web
        run: |
          npm install
          npm run build:offline
          npm run build:desktop

      - name: Build Tauri portable binary (.exe)
        working-directory: web
        run: |
          cargo build --release --manifest-path src-tauri/Cargo.toml

      - name: Package versioned standalone executable
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "dist-exe"
          $candidates = @(
            "web/src-tauri/target/release/jx3-loot-forge.exe",
            "web/src-tauri/target/release/剑网3掉落工坊.exe",
            "web/target/release/jx3-loot-forge.exe",
            "web/target/release/剑网3掉落工坊.exe",
            "target/release/jx3-loot-forge.exe",
            "target/release/剑网3掉落工坊.exe"
          )
          $rawExe = $null
          foreach ($cand in $candidates) {
            if (Test-Path $cand) {
              $rawExe = $cand
              Write-Host "Found binary at: $cand"
              break
            }
          }
          if (-not $rawExe) {
            $allExe = Get-ChildItem -Path . -Recurse -Filter "*.exe" | Where-Object { $_.FullName -notmatch "node_modules" } | Select-Object -ExpandProperty FullName
            Write-Host "Candidate executables found: $allExe"
            if ($allExe.Count -gt 0) {
              $rawExe = $allExe[0]
            } else {
              Write-Error "Could not find built executable."
              exit 1
            }
          }
          $destExeName = "剑网3掉落工坊-v${env:APP_VERSION}.exe"
          Copy-Item -Path $rawExe -Destination "dist-exe/$destExeName"
          Write-Host "Created standalone portable executable: dist-exe/$destExeName"
          "DEST_EXE_PATH=dist-exe/$destExeName" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "DEST_EXE_NAME=$destExeName" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Upload portable executable artifact
        uses: actions/upload-artifact@v4
        with:
          name: 剑网3掉落工坊-v${{ env.APP_VERSION }}-x64-免安装绿色版
          path: dist-exe/*.exe
          if-no-files-found: error

      - name: Create Release and Upload Assets (on tag only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: 剑网3掉落工坊 v${{ env.APP_VERSION }}
          draft: false
          prerelease: false
          files: |
            dist-exe/*.exe
            剑网3掉落工坊.html
          generate_release_notes: true
