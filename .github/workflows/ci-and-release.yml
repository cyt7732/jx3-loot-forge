name: CI and Offline Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  check-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'web/package-lock.json'

      - name: Extract App Version
        id: get_version
        run: |
          APP_VER=$(node -e "console.log(JSON.parse(require('fs').readFileSync('VERSION.json','utf8')).appVersion)")
          echo "APP_VERSION=$APP_VER" >> $GITHUB_ENV
          echo "App version is $APP_VER"

      - name: Install dependencies & run full checks
        working-directory: web
        run: |
          npm ci
          npm run check

      - name: Prepare release assets
        run: |
          npm run package:artifacts

      - name: Upload offline zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: jx3-loot-forge-v${{ env.APP_VERSION }}-offline
          path: artifacts/jx3-loot-forge-v${{ env.APP_VERSION }}-offline.zip
          if-no-files-found: error

      - name: Publish Release (on tag only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: 剑网3掉落工坊 v${{ env.APP_VERSION }}
          draft: false
          prerelease: false
          files: artifacts/jx3-loot-forge-v${{ env.APP_VERSION }}-offline.zip
          body_path: artifacts/剑网3掉落工坊-v${{ env.APP_VERSION }}/RELEASE_NOTES.md
          generate_release_notes: false
