name: CI and Offline Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  check-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'web/package.json'

      - name: Extract App Version
        id: get_version
        run: |
          APP_VER=$(node -e "console.log(JSON.parse(require('fs').readFileSync('VERSION.json','utf8')).appVersion)")
          echo "APP_VERSION=$APP_VER" >> $GITHUB_ENV
          echo "App version is $APP_VER"

      - name: Install dependencies & run full checks
        working-directory: web
        run: |
          npm ci
          npm run check

      - name: Prepare release assets
        run: |
          mkdir -p dist-release
          cp 剑网3掉落工坊.html dist-release/JX3-Loot-Forge-v${{ env.APP_VERSION }}.html

      - name: Upload offline HTML artifact
        uses: actions/upload-artifact@v4
        with:
          name: 剑网3掉落工坊-v${{ env.APP_VERSION }}-离线网页版
          path: dist-release/*.html
          if-no-files-found: error

      - name: Publish Release (on tag only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: 剑网3掉落工坊 v${{ env.APP_VERSION }}
          draft: false
          prerelease: false
          files: dist-release/*.html
          generate_release_notes: true
