name: CI and Offline Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  check-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'web/package.json'

      - name: Extract App Version
        id: get_version
        run: |
          APP_VER=$(node -e "console.log(JSON.parse(require('fs').readFileSync('VERSION.json','utf8')).appVersion)")
          echo "APP_VERSION=$APP_VER" >> $GITHUB_ENV
          echo "App version is $APP_VER"

      - name: Install dependencies & run full checks
        working-directory: web
        run: |
          npm install
          npm run check

      - name: Prepare release assets
        run: |
          mkdir -p artifacts/剑网3掉落工坊-v${{ env.APP_VERSION }}
          cp 剑网3掉落工坊.html artifacts/剑网3掉落工坊-v${{ env.APP_VERSION }}/index.html
          cp CHANGELOG.md artifacts/剑网3掉落工坊-v${{ env.APP_VERSION }}/
          cp README.md artifacts/剑网3掉落工坊-v${{ env.APP_VERSION }}/
          cp LICENSE artifacts/剑网3掉落工坊-v${{ env.APP_VERSION }}/
          cp VERSION.json artifacts/剑网3掉落工坊-v${{ env.APP_VERSION }}/
          if [ ! -f artifacts/剑网3掉落工坊-v${{ env.APP_VERSION }}/RELEASE_NOTES.md ]; then
            echo "# 剑网3掉落工坊 v${{ env.APP_VERSION }}" > artifacts/剑网3掉落工坊-v${{ env.APP_VERSION }}/RELEASE_NOTES.md
          fi
          cd artifacts && zip -r ../artifacts/jx3-loot-forge-v${{ env.APP_VERSION }}-offline.zip 剑网3掉落工坊-v${{ env.APP_VERSION }} && cd ..

      - name: Upload offline zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: jx3-loot-forge-v${{ env.APP_VERSION }}-offline
          path: artifacts/jx3-loot-forge-v${{ env.APP_VERSION }}-offline.zip
          if-no-files-found: error

      - name: Publish Release (on tag only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: 剑网3掉落工坊 v${{ env.APP_VERSION }}
          draft: false
          prerelease: false
          files: |
            artifacts/jx3-loot-forge-v${{ env.APP_VERSION }}-offline.zip
            剑网3掉落工坊.html
          generate_release_notes: false
