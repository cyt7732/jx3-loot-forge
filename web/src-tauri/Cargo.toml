[package]
name = "jx3-loot-forge"
version = "1.0.5"
description = "剑网3掉落工坊"
authors = ["凌千羽"]
edition = "2021"

[lib]
name = "jx3_loot_forge_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
